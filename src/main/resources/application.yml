spring:
  application:
    name: dashboard-mini
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dashboard}
    username: ${DB_USER:dashboard}
    password: ${DB_PASSWORD:dashboard}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
dashboard:
  api-key: ${DASHBOARD_API_KEY:}
  admin-email: ${DASHBOARD_ADMIN_EMAIL:}
  admin-password-hash: ${DASHBOARD_ADMIN_PASSWORD_HASH:}
  # Sem DASHBOARD_ADMIN_PASSWORD nem hash, a senha padrao e "admin" (usado no develop).
  admin-password: ${DASHBOARD_ADMIN_PASSWORD:admin}
  jwt-secret: ${DASHBOARD_JWT_SECRET:}
server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${PORT:8080}
