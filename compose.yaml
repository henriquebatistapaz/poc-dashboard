name: poc-dashboard
services:
  postgres:
    image: postgres:18-alpine
    environment:
      PGDATA: /var/lib/postgresql/data
      POSTGRES_DB: dashboard
      POSTGRES_USER: dashboard
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD locally}
    ports:
      - "127.0.0.1:${DB_PORT:-15432}:5432"
    volumes:
      - dashboard_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dashboard -d dashboard"]
      interval: 3s
      timeout: 3s
      retries: 20
  dashboard:
    build: .
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 3s
      timeout: 3s
      start_period: 20s
      retries: 20
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8084}:8080"
    environment:
      SERVER_ADDRESS: 0.0.0.0
      DB_URL: jdbc:postgresql://postgres:5432/dashboard
      DB_USER: dashboard
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD locally}
      DASHBOARD_API_KEY: ${DASHBOARD_API_KEY:?Set DASHBOARD_API_KEY locally}
      DASHBOARD_ADMIN_EMAIL: ${DASHBOARD_ADMIN_EMAIL:-}
      DASHBOARD_ADMIN_PASSWORD_HASH: ${DASHBOARD_ADMIN_PASSWORD_HASH:-}
      DASHBOARD_JWT_SECRET: ${DASHBOARD_JWT_SECRET:-}
  frontend:
    build: ./frontend
    depends_on:
      dashboard:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8085}:80"
volumes:
  dashboard_postgres:
