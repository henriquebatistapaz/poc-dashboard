name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Instalar bibliotecas locais (libs/)
        run: |
          for repo in poc-collector poc-rss-collector poc-collector-runner; do
            mvn -B -q -f "libs/${repo}/pom.xml" -DskipTests install
          done
      - name: Testes
        run: mvn -B test
      - name: Build do jar
        run: mvn -B -DskipTests package

  frontend:
    name: Frontend (Vue)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Instalar dependências
        run: npm ci
      - name: Testes unitários
        run: npm test
      - name: Build
        run: npm run build
